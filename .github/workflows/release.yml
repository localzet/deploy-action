name: Publish release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version, e.g. v1.0.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  release:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish immutable version and major alias
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          major="${VERSION%%.*}"
          # Refuse to move a major alias backwards or replace existing versions.
          latest="$(git tag --list "$major.*" | sort -V | tail -n 1)"
          if [[ -n "$latest" && "$(printf '%s\n' "$latest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]]; then
            echo 'Version would move major tag backwards' >&2
            exit 1
          fi
          if git rev-parse --verify "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo 'Version already exists' >&2; exit 1
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --generate-notes --title "$VERSION"
          old="$(git ls-remote --tags origin "refs/tags/$major" | cut -f1)"
          git tag -f "$major" "$GITHUB_SHA"
          git push "--force-with-lease=refs/tags/$major:$old" origin "refs/tags/$major"
