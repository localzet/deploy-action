name: Localzet Deploy
description: Deploy Docker Compose over SSH with release isolation and rollback.
branding:
  icon: upload-cloud
  color: blue
inputs:
  source-path:
    description: "Checkout directory relative to GITHUB_WORKSPACE."
    default: "."
  compose-files:
    description: "Newline-separated Compose paths; autodetect if empty."
    default: ""
  project-name:
    description: "Stable Compose project name."
    default: ""
  deploy-path:
    description: "Absolute dedicated remote directory."
    default: ""
  shared-paths:
    description: "Newline-separated paths linked to existing shared data."
    default: ""
  profiles:
    description: "Newline-separated Compose profiles."
    default: ""
  pull-policy:
    description: "Pull policy for registry images: always, missing, never."
    default: "always"
  wait-timeout:
    description: "Compose readiness timeout in seconds."
    default: "120"
  health-url:
    description: "Optional HTTP(S) readiness URL checked on server."
    default: ""
  health-timeout:
    description: "HTTP readiness timeout in seconds."
    default: "60"
  keep-releases:
    description: "Number of retained successful releases."
    default: "3"
  operation:
    description: "deploy or rollback."
    default: "deploy"
  build-mode:
    description: "Build location: vps, runner or registry."
    default: "vps"
  registry-prefix:
    description: "Fully qualified image repository for registry mode."
    default: ""
  backup:
    description: "Commands in old running services, before migration. One SERVICE COMMAND per line."
    default: ""
  pre-deploy:
    description: "One-off commands in new images before activation. One SERVICE COMMAND per line."
    default: ""
  post-deploy:
    description: "Commands in new running services after readiness. One SERVICE COMMAND per line."
    default: ""
outputs:
  release:
    description: Active release ID.
    value: ${{ steps.deploy.outputs.release }}
  project:
    description: Compose project name.
    value: ${{ steps.deploy.outputs.project }}
runs:
  using: composite
  steps:
    - id: deploy
      shell: bash
      env:
        ACTION_SOURCE_PATH: ${{ inputs.source-path }}
        ACTION_COMPOSE_FILES: ${{ inputs.compose-files }}
        ACTION_PROJECT_NAME: ${{ inputs.project-name }}
        ACTION_DEPLOY_PATH: ${{ inputs.deploy-path }}
        ACTION_SHARED_PATHS: ${{ inputs.shared-paths }}
        ACTION_PROFILES: ${{ inputs.profiles }}
        ACTION_PULL_POLICY: ${{ inputs.pull-policy }}
        ACTION_WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
        ACTION_HEALTH_URL: ${{ inputs.health-url }}
        ACTION_HEALTH_TIMEOUT: ${{ inputs.health-timeout }}
        ACTION_KEEP_RELEASES: ${{ inputs.keep-releases }}
        ACTION_OPERATION: ${{ inputs.operation }}
        ACTION_BUILD_MODE: ${{ inputs.build-mode }}
        ACTION_REGISTRY_PREFIX: ${{ inputs.registry-prefix }}
        ACTION_BACKUP: ${{ inputs.backup }}
        ACTION_PRE_DEPLOY: ${{ inputs.pre-deploy }}
        ACTION_POST_DEPLOY: ${{ inputs.post-deploy }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/client.py"
    - name: Optional Telegram notification
      if: ${{ always() }}
      shell: bash
      env:
        DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        DEPLOY_RELEASE: ${{ steps.deploy.outputs.release }}
        DEPLOY_OPERATION: ${{ inputs.operation }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/notify.py"
